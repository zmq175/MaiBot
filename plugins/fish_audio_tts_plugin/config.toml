# Fish Audio TTS Plugin Configuration

[plugin]
enabled = true

[components]
enable_fish_audio_tts = true
enable_fish_audio_command = true

[fish_audio]
max_retries = 3
timeout = 60
random_activation_probability = 0.8

[fish_audio.voice_settings]
stability = 0.5
similarity_boost = 0.75

[proxy]
enabled = true
url = "socks5://127.0.0.1:1080"

[logging]
level = "INFO"
prefix = "[Fish Audio TTS]" 