# Fish Audio TTS Plugin Configuration
[fish_audio_tts]
# 触发概率 (0.0 - 1.0)
trigger_probability = 0.1

# API配置
api_base_url = "https://api.fish.audio/v1"

# 重试配置
max_retries = 3
timeout = 30

# 语音设置
[fish_audio_tts.voice_settings]
# 稳定性 (0.0 - 1.0)
stability = 0.5
# 相似度提升 (0.0 - 1.0)
similarity_boost = 0.75

# 代理配置 (可选)
[fish_audio_tts.proxy]
# 代理URL，例如: "http://127.0.0.1:7890"
proxy_url = ""

# 环境变量配置说明:
# FISH_AUDIO_API_KEY: Fish Audio API密钥
# FISH_AUDIO_MODEL_ID: 语音模型ID
# FISH_AUDIO_PROXY_URL: 代理URL (可选) 